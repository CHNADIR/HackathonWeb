      <polygon class="wall" points="125,50 150,25 150,110 125,135"/>
      <polygon class="front" points="0,50 125,50 125,135 0,135"/>
      <polygon fill="url(#roofGreen)" points="0,50 25,25 150,25 125,50"/>
      <text class="label" x="62" y="102">BU</text>
      <text class="small" x="62" y="123">Bibliotheque</text>
    </g>

    <g transform="translate(210 235)">
      <polygon class="side" points="0,50 125,50 150,25 25,25"/>
      <polygon class="wall" points="125,50 150,25 150,108 125,133"/>
      <polygon class="front" points="0,50 125,50 125,133 0,133"/>
      <polygon fill="url(#roofGreen)" points="0,50 25,25 150,25 125,50"/>
      <text class="label" x="62" y="102">MDE</text>
      <text class="small" x="62" y="123">Vie etudiante</text>
    </g>

    <g transform="translate(180 455)">
      <polygon class="side" points="0,45 130,45 155,20 25,20"/>
      <polygon class="wall" points="130,45 155,20 155,100 130,125"/>
      <polygon class="front" points="0,45 130,45 130,125 0,125"/>
      <polygon fill="url(#roofOrange)" points="0,45 25,20 155,20 130,45"/>
      <text class="label" x="65" y="95">G</text>
      <text class="small" x="65" y="116">Accueil</text>
    </g>

    <g transform="translate(895 410)">
      <polygon class="side" points="0,45 120,45 145,20 25,20"/>
      <polygon class="wall" points="120,45 145,20 145,95 120,120"/>
      <polygon class="front" points="0,45 120,45 120,120 0,120"/>
      <polygon fill="url(#roofGreen)" points="0,45 25,20 145,20 120,45"/>
      <text class="label" x="60" y="91">L</text>
      <text class="small" x="60" y="111">Batiment L</text>
    </g>

    <g transform="translate(765 510)">
      <polygon class="side" points="0,45 120,45 145,20 25,20"/>
      <polygon class="wall" points="120,45 145,20 145,95 120,120"/>
      <polygon class="front" points="0,45 120,45 120,120 0,120"/>
      <polygon fill="url(#roofOrange)" points="0,45 25,20 145,20 120,45"/>
      <text class="label" x="60" y="91">J</text>
      <text class="small" x="60" y="111">Amphis</text>
    </g>

    <g transform="translate(515 520)">
      <polygon class="side" points="0,42 140,42 165,17 25,17"/>
      <polygon class="wall" points="140,42 165,17 165,88 140,113"/>
      <polygon class="front" points="0,42 140,42 140,113 0,113"/>
      <polygon fill="url(#roofGreen)" points="0,42 25,17 165,17 140,42"/>
      <text class="label" x="70" y="85">CROUS</text>
      <text class="small" x="70" y="104">Restauration</text>
    </g>
  </g>

  <g>
    <circle cx="200" cy="640" r="18" fill="#fd5e42"/>
    <text x="200" y="695" class="label">Entree M13</text>
    <text x="200" y="718" class="small">Saint-Denis Universite</text>
  </g>
  <g>
    <rect x="45" y="35" width="360" height="92" rx="22" fill="#ffffff" opacity=".92"/>
    <text x="225" y="75" class="label">Universite Paris 8</text>
    <text x="225" y="102" class="small">Plan 3D simplifie du campus</text>
  </g>
</svg>
